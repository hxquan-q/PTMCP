spring:
  application:
    name: ptmcp-authz
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.JdbcTemplateAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.health.DataSourceHealthContributorAutoConfiguration
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${PTMCP_AUTHZ_DB_URL:}
    username: ${PTMCP_AUTHZ_DB_USERNAME:}
    password: ${PTMCP_AUTHZ_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  address: 127.0.0.1
  port: ${PTMCP_AUTHZ_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 8h
      cookie:
        name: PTMCP_AS_SESSION
        http-only: true
        secure: ${PTMCP_AS_COOKIE_SECURE:true}
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
ptmcp:
  authz:
    oauth:
      enabled: ${PTMCP_OAUTH_ENABLED:false}
      issuer: ${PTMCP_OAUTH_ISSUER:http://127.0.0.1:8081}
      audience: ${PTMCP_OAUTH_AUDIENCE:ptmcp-mcp}
      signing-key-file: ${PTMCP_OAUTH_SIGNING_KEY_FILE:}
      authorization-code-ttl: ${PTMCP_OAUTH_CODE_TTL:5m}
      access-token-ttl: ${PTMCP_OAUTH_ACCESS_TTL:10m}
