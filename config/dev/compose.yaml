name: ptmcp-dev

services:
  mysql:
    # Default is the pinned MySQL 8.4 image. The override exists only for
    # disposable local development when the pinned image cannot be pulled.
    image: ${PTMCP_MYSQL_IMAGE:-mysql@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69}
    container_name: ptmcp-mysql
    restart: unless-stopped
    ports: ['127.0.0.1:13306:3306']
    environment:
      MYSQL_DATABASE: ptmcp_dev
      MYSQL_USER: ptmcp_dev
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root
      MYSQL_PASSWORD_FILE: /run/secrets/mysql_app
    command: ['--default-time-zone=+00:00', '--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    secrets: [mysql_root, mysql_app, mysql_client]
    volumes: [mysql_data:/var/lib/mysql]
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'mysql --defaults-extra-file=/run/secrets/mysql_client -N -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    container_name: ptmcp-postgres
    restart: unless-stopped
    ports: ['127.0.0.1:15432:5432']
    environment:
      POSTGRES_DB: ptmcp_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_root
      TZ: UTC
    secrets: [postgres_root, postgres_app]
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./secrets/postgres-init.sql:/docker-entrypoint-initdb.d/01-ptmcp.sql:ro
    mem_limit: 512m
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ptmcp_dev -d ptmcp_dev']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis@sha256:44960b3100c48159a66d28c18b0588c193492e25f7551d60e51dd464fc3eca5b
    container_name: ptmcp-redis
    restart: unless-stopped
    ports: ['127.0.0.1:16379:6379']
    command: ['redis-server', '/run/secrets/redis_config']
    secrets: [redis_password, redis_config]
    volumes: [redis_data:/data]
    mem_limit: 256m
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
  postgres_data:
  redis_data:

secrets:
  mysql_root:
    file: ./secrets/mysql-root.txt
  mysql_app:
    file: ./secrets/mysql-app.txt
  mysql_client:
    file: ./secrets/mysql-client.cnf
  postgres_root:
    file: ./secrets/postgres-root.txt
  postgres_app:
    file: ./secrets/postgres-app.txt
  redis_password:
    file: ./secrets/redis-password.txt
  redis_config:
    file: ./secrets/redis.conf
