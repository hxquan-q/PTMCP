# PTMCP UI 入口：静态 SPA + 三个后端前缀 + OAuth 页与 MCP 的同源代理。
# 所有上游都走 Compose 服务名；容器只监听 8080，宿主机端口由 compose 发布。
# 镜像以 nginx 用户启动（非 root），因此不设 user 指令。
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    # 只读根文件系统的可写临时目录，由 compose 的 tmpfs /tmp 承载。
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    server_tokens off;
    client_max_body_size 2m;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok';
        }

        # 与 vite.config.ts 的代理前缀保持一致：/backend/<app>/... 去掉前缀后转发。
        location /backend/admin/ {
            proxy_pass http://admin:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 130s;
        }
        location = /backend/admin {
            return 308 /backend/admin/;
        }

        location /backend/authz/ {
            proxy_pass http://authz:8081/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 130s;
        }
        location = /backend/authz {
            return 308 /backend/authz/;
        }

        location /backend/gateway/ {
            proxy_pass http://gateway:8082/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 130s;
        }
        location = /backend/gateway {
            return 308 /backend/gateway/;
        }

        # OAuth 登录/授权页与令牌端点由 authz 同源提供；页面资产 base 为 /oauth/。
        location /oauth/ {
            proxy_pass http://authz:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /oauth2/ {
            proxy_pass http://authz:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 受保护资源元数据由 gateway 提供，其余 AS 元数据归 authz。
        location = /.well-known/oauth-protected-resource {
            proxy_pass http://gateway:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /.well-known/ {
            proxy_pass http://authz:8081;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Agent 的 MCP 入口。
        location /mcp {
            proxy_pass http://gateway:8082;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 130s;
        }

        # SPA：静态资源一年缓存，入口 HTML 不缓存。
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "no-store";
            try_files $uri $uri/ /index.html;
        }
    }
}
